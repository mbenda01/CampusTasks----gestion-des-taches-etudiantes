name: Publication de l'image Docker

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  image:
    name: Construction et publication sur Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "valeur=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/campus-tasks-api:${{ steps.version.outputs.valeur }}
            ${{ secrets.DOCKERHUB_USERNAME }}/campus-tasks-api:latest
